<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LMS Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center">
                <i class="bi bi-mortarboard-fill me-2 text-primary fs-1"></i>
                <span class="fs-2">LMS Platform</span>
            </a>
        </div>
        
        <div class="card p-4 p-md-5 border-0 shadow-lg">
            <h2 class="h3 fw-bold mb-2">Reset Password</h2>
            <p class="text-secondary mb-4">Enter your email and we'll send you instructions to reset your password.</p>
            
            <form action="#" class="needs-validation" novalidate id="forgot-form">
                <div class="mb-4">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 mb-3">Send Reset Link</button>
                
                <div class="text-center small text-secondary">
                    Remember your password? <a href="login.html" class="fw-bold">Login</a>
                </div>
            </form>

            <div id="success-message" class="text-center d-none">
                <div class="stat-icon mx-auto mb-4 bg-accent-light text-accent">
                    <i class="bi bi-envelope-check"></i>
                </div>
                <h3 class="h4 fw-bold">Check your email</h3>
                <p class="text-secondary mb-4">We've sent a password reset link to your email address.</p>
                <a href="login.html" class="btn btn-primary w-100 py-3">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/role-switcher.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (this.checkValidity()) {
                this.classList.add('d-none');
                document.getElementById('success-message').classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
