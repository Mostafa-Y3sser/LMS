<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LMS Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--bg-color) 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .auth-card {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand d-flex align-items-center justify-content-center">
                <i class="bi bi-mortarboard-fill me-2 text-primary fs-1"></i>
                <span class="fs-2">LMS Platform</span>
            </a>
        </div>
        
        <div class="card p-4 p-md-5 border-0 shadow-lg">
            <h2 class="h3 fw-bold mb-2">Create Your Account</h2>
            <p class="text-secondary mb-4">Start your learning journey today.</p>
            
            <form action="student/dashboard.html" class="needs-validation" novalidate>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">First Name</label>
                        <input type="text" class="form-control" placeholder="John" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Last Name</label>
                        <input type="text" class="form-control" placeholder="Doe" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary border-start-0" type="button"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-3 mb-3">Register Account</button>
                
                <div class="text-center small text-secondary">
                    Already have an account? <a href="login.html" class="fw-bold">Login</a>
                </div>
            </form>
        </div>
        
        <div class="mt-4 text-center">
            <a href="index.html" class="text-secondary small"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/role-switcher.js"></script>
</body>
</html>
