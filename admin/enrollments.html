<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Enrollments - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">LMS Platform</h1>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link ">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="users.html" class="menu-link ">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <li class="menu-item">
                    <a href="courses.html" class="menu-link ">
                        <i class="bi bi-book"></i> Courses
                    </a>
                </li>
                <li class="menu-item">
                    <a href="enrollments.html" class="menu-link active">
                        <i class="bi bi-clipboard-check"></i> Enrollments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="submissions.html" class="menu-link ">
                        <i class="bi bi-file-earmark-check"></i> Submissions
                    </a>
                </li>
                <li class="menu-item">
                    <a href="payments.html" class="menu-link ">
                        <i class="bi bi-credit-card"></i> Payments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="send-notification.html" class="menu-link ">
                        <i class="bi bi-send"></i> Send Notification
                    </a>
                </li>
                <li class="menu-item">
                    <a href="profile.html" class="menu-link ">
                        <i class="bi bi-person-badge"></i> Profile
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <div class="user-avatar-sm" style="background-color: var(--error-color);">AK</div>
                    <div class="small">
                        <div class="fw-bold">Alex King</div>
                        <div class="text-white-50">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header animate-fade-in">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light d-lg-none me-3" id="sidebar-toggle"><i class="bi bi-list"></i></button>
                    <h2 class="h4 mb-0">System Enrollments</h2>
                </div>
            </header>

            <div class="card border-0 shadow-sm animate-fade-in">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-muted small text-uppercase">
                            <tr>
                                <th class="ps-4">Student</th>
                                <th>Course</th>
                                <th>Enroll Date</th>
                                <th>Progress</th>
                                <th class="text-end pe-4">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <div class="user-avatar-sm me-2 bg-primary text-white">MC</div>
                                        <span class="small fw-bold">Maya Chen</span>
                                    </div>
                                </td>
                                <td class="small">Full-Stack Web Development</td>
                                <td class="small text-muted">Jan 15, 2026</td>
                                <td>
                                    <div class="progress" style="height: 6px; width: 100px;">
                                        <div class="progress-bar" style="width: 65%;"></div>
                                    </div>
                                    <span class="small text-muted" style="font-size: 0.65rem;">65%</span>
                                </td>
                                <td class="text-end pe-4">
                                    <span class="badge bg-success-subtle text-success rounded-pill">Active</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/role-switcher.js"></script>
</body>
</html>
