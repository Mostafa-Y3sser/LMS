<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assistant - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar Placeholder -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">LMS Platform</h1>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link ">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="users.html" class="menu-link active">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <li class="menu-item">
                    <a href="courses.html" class="menu-link ">
                        <i class="bi bi-book"></i> Courses
                    </a>
                </li>
                <li class="menu-item">
                    <a href="enrollments.html" class="menu-link ">
                        <i class="bi bi-clipboard-check"></i> Enrollments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="submissions.html" class="menu-link ">
                        <i class="bi bi-file-earmark-check"></i> Submissions
                    </a>
                </li>
                <li class="menu-item">
                    <a href="payments.html" class="menu-link ">
                        <i class="bi bi-credit-card"></i> Payments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="send-notification.html" class="menu-link ">
                        <i class="bi bi-send"></i> Send Notification
                    </a>
                </li>
                <li class="menu-item">
                    <a href="profile.html" class="menu-link ">
                        <i class="bi bi-person-badge"></i> Profile
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <div class="user-avatar-sm" style="background-color: var(--error-color);">AK</div>
                    <div class="small">
                        <div class="fw-bold">Alex King</div>
                        <div class="text-white-50">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header animate-fade-in">
                <div class="d-flex align-items-center">
                    <a href="users.html" class="btn btn-light me-3"><i class="bi bi-arrow-left"></i></a>
                    <h2 class="h4 mb-0">Create Assistant Account</h2>
                </div>
            </header>

            <div class="row justify-content-center animate-fade-in">
                <div class="col-lg-6">
                    <div class="card p-4 p-md-5 border-0 shadow-sm">
                        <div class="text-center mb-4">
                            <div class="stat-icon bg-warning-light text-warning mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                                <i class="bi bi-person-gear"></i>
                            </div>
                            <h3 class="h5 fw-bold">New Assistant</h3>
                            <p class="text-secondary small">Fill in the details to create a teaching assistant account.</p>
                        </div>
                        
                        <form action="users.html">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">First Name</label>
                                    <input type="text" class="form-control" placeholder="Sarah" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Miller" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email Address</label>
                                <input type="email" class="form-control" placeholder="sarah.m@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Password</label>
                                <input type="text" class="form-control" value="Assistant@2026" required>
                                <div class="form-text small">Default password for first login.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Create Assistant Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/role-switcher.js"></script>
</body>
</html>
