<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">LMS Platform</h1>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link ">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="users.html" class="menu-link ">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <li class="menu-item">
                    <a href="courses.html" class="menu-link active">
                        <i class="bi bi-book"></i> Courses
                    </a>
                </li>
                <li class="menu-item">
                    <a href="enrollments.html" class="menu-link ">
                        <i class="bi bi-clipboard-check"></i> Enrollments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="submissions.html" class="menu-link ">
                        <i class="bi bi-file-earmark-check"></i> Submissions
                    </a>
                </li>
                <li class="menu-item">
                    <a href="payments.html" class="menu-link ">
                        <i class="bi bi-credit-card"></i> Payments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="send-notification.html" class="menu-link ">
                        <i class="bi bi-send"></i> Send Notification
                    </a>
                </li>
                <li class="menu-item">
                    <a href="profile.html" class="menu-link ">
                        <i class="bi bi-person-badge"></i> Profile
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <div class="user-avatar-sm" style="background-color: var(--error-color);">AK</div>
                    <div class="small">
                        <div class="fw-bold">Alex King</div>
                        <div class="text-white-50">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header animate-fade-in">
                <div class="d-flex align-items-center justify-content-between w-100">
                    <div class="d-flex align-items-center">
                        <button class="btn btn-light d-lg-none me-3" id="sidebar-toggle"><i class="bi bi-list"></i></button>
                        <h2 class="h4 mb-0">Course Management</h2>
                    </div>
                    <a href="create-course.html" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-2"></i> Create Course
                    </a>
                </div>
            </header>

            <div class="card border-0 shadow-sm p-3 mb-4 animate-fade-in">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Search courses...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option selected>All Categories</option>
                            <option>Development</option>
                            <option>Design</option>
                            <option>Marketing</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option selected>Status: All</option>
                            <option>Active</option>
                            <option>Draft</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm animate-fade-in">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-muted small text-uppercase">
                            <tr>
                                <th class="ps-4">Course</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Students</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <img src="../assets/images/course_web_dev.png" class="rounded me-3" style="width: 50px; height: 35px; object-fit: cover;">
                                        <div>
                                            <div class="fw-bold">Full-Stack Web Dev</div>
                                            <div class="text-muted small">Prof. Sarah Johnson</div>
                                        </div>
                                    </div>
                                </td>
                                <td><span class="badge bg-light text-dark">Development</span></td>
                                <td class="small fw-bold">$89.99</td>
                                <td class="small">1,240</td>
                                <td><span class="badge bg-success-subtle text-success rounded-pill">Active</span></td>
                                <td class="text-end pe-4">
                                    <div class="btn-group">
                                        <a href="edit-course.html" class="btn btn-light btn-sm" title="Edit Content"><i class="bi bi-pencil-square"></i></a>
                                        <a href="modules.html" class="btn btn-light btn-sm" title="Manage Lessons"><i class="bi bi-collection-play"></i></a>
                                        <button class="btn btn-outline-danger btn-sm" title="Unpublish"><i class="bi bi-eye-slash"></i></button>
                                    </div>
                                </td>
                            </tr>
                            <!-- more rows ... -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/role-switcher.js"></script>
</body>
</html>
