<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignment - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">LMS Platform</h1>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link ">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="users.html" class="menu-link ">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>
                <li class="menu-item">
                    <a href="courses.html" class="menu-link ">
                        <i class="bi bi-book"></i> Courses
                    </a>
                </li>
                <li class="menu-item">
                    <a href="enrollments.html" class="menu-link ">
                        <i class="bi bi-clipboard-check"></i> Enrollments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="submissions.html" class="menu-link active">
                        <i class="bi bi-file-earmark-check"></i> Submissions
                    </a>
                </li>
                <li class="menu-item">
                    <a href="payments.html" class="menu-link ">
                        <i class="bi bi-credit-card"></i> Payments
                    </a>
                </li>
                <li class="menu-item">
                    <a href="send-notification.html" class="menu-link ">
                        <i class="bi bi-send"></i> Send Notification
                    </a>
                </li>
                <li class="menu-item">
                    <a href="profile.html" class="menu-link ">
                        <i class="bi bi-person-badge"></i> Profile
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <div class="user-avatar-sm" style="background-color: var(--error-color);">AK</div>
                    <div class="small">
                        <div class="fw-bold">Alex King</div>
                        <div class="text-white-50">Admin</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header animate-fade-in">
                <div class="d-flex align-items-center">
                    <a href="modules.html" class="btn btn-light me-3"><i class="bi bi-arrow-left"></i></a>
                    <h2 class="h4 mb-0">Manage Assignment</h2>
                </div>
            </header>

            <div class="row justify-content-center animate-fade-in">
                <div class="col-lg-8">
                    <div class="card p-4 p-md-5 border-0 shadow-sm">
                        <form action="modules.html">
                            <div class="mb-4">
                                <label class="form-label fw-bold">Assignment Title</label>
                                <input type="text" class="form-control form-control-lg" value="Module 2: Personal Portfolio Project">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Instructions (Markdown/HTML)</label>
                                <textarea class="form-control" rows="10">Build a personal portfolio website using only HTML5 and CSS3. The page must include a header, navigation, a bio section, a projects list, and a footer.</textarea>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Maximum Score</label>
                                    <input type="number" class="form-control" value="100">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Resource File</label>
                                    <input type="file" class="form-control">
                                    <div class="form-text small">Current: Assignment_Guidelines.pdf</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between pt-4 border-top">
                                <button type="button" class="btn btn-outline-danger">Delete Assignment</button>
                                <button type="submit" class="btn btn-primary px-5">Save Assignment</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/role-switcher.js"></script>
</body>
</html>
