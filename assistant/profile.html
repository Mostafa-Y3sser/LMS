<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - LMS Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Assistant Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">LMS Platform</h1>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link">
                        <i class="bi bi-grid-1x2-fill"></i> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="submissions.html" class="menu-link">
                        <i class="bi bi-file-earmark-text"></i> Submissions
                    </a>
                </li>
                <li class="menu-item">
                    <a href="courses.html" class="menu-link">
                        <i class="bi bi-collection-play"></i> Courses
                    </a>
                </li>
                <li class="menu-item">
                    <a href="profile.html" class="menu-link active">
                        <i class="bi bi-person"></i> Profile
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <div class="user-avatar-sm" style="background-color: var(--warning-color);">SM</div>
                    <div class="small">
                        <div class="fw-bold">Sarah Miller</div>
                        <div class="text-white-50">Assistant</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header animate-fade-in">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light d-lg-none me-3" id="sidebar-toggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <h2 class="h4 mb-0">Profile Settings</h2>
                </div>
            </header>

            <div class="container-fluid animate-fade-in">
                <div class="row g-4">
                    <!-- Left Column: Avatar -->
                    <div class="col-lg-4">
                        <div class="card p-4 text-center">
                            <div class="position-relative d-inline-block mx-auto mb-4">
                                <div class="user-avatar-lg bg-warning text-white d-flex align-items-center justify-content-center fw-bold fs-1 rounded-circle shadow-md" style="width: 150px; height: 150px;">SM</div>
                                <button class="btn btn-primary btn-sm position-absolute bottom-0 end-0 rounded-circle p-2 border-white border-3">
                                    <i class="bi bi-camera"></i>
                                </button>
                            </div>
                            <h3 class="h5 fw-bold mb-1">Sarah Miller</h3>
                            <div class="mb-3">
                                <span class="badge badge-role badge-assistant">ASSISTANT</span>
                            </div>
                            <p class="text-muted small">Assistant since March 2026</p>
                            <hr class="my-4">
                            <div class="text-start">
                                <h6 class="fw-bold small text-muted text-uppercase mb-3">Teaching Stats</h6>
                                <p class="small mb-2">Courses Assisted: 4</p>
                                <p class="small mb-2">Pending Submissions: 12</p>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Info & Security -->
                    <div class="col-lg-8">
                        <div class="card p-4 mb-4">
                            <h4 class="h5 fw-bold mb-4">Personal Information</h4>
                            <form>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">First Name</label>
                                        <input type="text" class="form-control" value="Sarah">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Last Name</label>
                                        <input type="text" class="form-control" value="Miller">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Email Address</label>
                                        <input type="email" class="form-control" value="sarah.miller@example.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Phone Number</label>
                                        <input type="tel" class="form-control" value="+1 (555) 000-0000">
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary px-4">Update Profile</button>
                                </div>
                            </form>
                        </div>

                        <div class="card p-4">
                            <h4 class="h5 fw-bold mb-4">Security</h4>
                            <form>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Current Password</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">New Password</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Confirm New Password</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>
                                </div>
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-outline-primary px-4">Change Password</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/role-switcher.js"></script>
</body>
</html>
