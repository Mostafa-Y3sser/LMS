<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Submissions - LMS Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Assistant Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-logo">LMS Platform</h1>
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a href="dashboard.html" class="menu-link">
                        <i class="bi bi-grid-1x2-fill"></i> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="submissions.html" class="menu-link active">
                        <i class="bi bi-file-earmark-text"></i> Submissions
                    </a>
                </li>
                <li class="menu-item">
                    <a href="courses.html" class="menu-link">
                        <i class="bi bi-collection-play"></i> Courses
                    </a>
                </li>
                <li class="menu-item">
                    <a href="profile.html" class="menu-link">
                        <i class="bi bi-person"></i> Profile
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info-brief">
                    <div class="user-avatar-sm" style="background-color: var(--warning-color);">SM</div>
                    <div class="small">
                        <div class="fw-bold">Sarah Miller</div>
                        <div class="text-white-50">Assistant</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header animate-fade-in">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light d-lg-none me-3" id="sidebar-toggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <h2 class="h4 mb-0">All Submissions</h2>
                </div>
            </header>

            <!-- Filters -->
            <div class="card border-0 shadow-sm p-3 mb-4 animate-fade-in">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" placeholder="Search student or ID...">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option selected>All Courses</option>
                            <option>Web Development</option>
                            <option>UI/UX Design</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select">
                            <option selected>Status: All</option>
                            <option>Pending</option>
                            <option>Graded</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100">Filter</button>
                    </div>
                </div>
            </div>

            <!-- Submissions Table -->
            <div class="card border-0 shadow-sm animate-fade-in">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Student</th>
                                <th>Assignment</th>
                                <th>Submitted</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <div class="user-avatar-sm me-2 bg-primary text-white">MC</div>
                                        <span>Maya Chen</span>
                                    </div>
                                </td>
                                <td>Module 2 Project</td>
                                <td class="small">Apr 24, 2026</td>
                                <td><span class="badge bg-warning-subtle text-warning rounded-pill">Pending</span></td>
                                <td class="text-end pe-4">
                                    <a href="grade-submission.html" class="btn btn-primary btn-sm">Grade</a>
                                </td>
                            </tr>
                            <tr>
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <div class="user-avatar-sm me-2 bg-info text-white">MK</div>
                                        <span>Michael Kane</span>
                                    </div>
                                </td>
                                <td>Basic HTML Page</td>
                                <td class="small">Apr 22, 2026</td>
                                <td><span class="badge bg-success-subtle text-success rounded-pill">Graded</span></td>
                                <td class="text-end pe-4">
                                    <button class="btn btn-light btn-sm">View Grade</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/role-switcher.js"></script>
</body>
</html>
