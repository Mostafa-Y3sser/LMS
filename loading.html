<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - LMS Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .splash-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff;
        }
        .spinner-grow {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>

    <div class="splash-screen">
        <div class="mb-4">
            <i class="bi bi-mortarboard-fill text-primary display-1"></i>
        </div>
        <div class="spinner-grow text-primary mb-3" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h2 class="h5 fw-bold text-primary">LMS Platform</h2>
        <p class="text-muted small">Preparing your learning experience...</p>
    </div>

    <script>
        // Simulate redirect after load
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    </script>
    <script src="assets/js/role-switcher.js"></script>
</body>
</html>
